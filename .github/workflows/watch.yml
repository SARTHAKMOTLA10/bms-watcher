name: BookMyShow Show Watcher

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay slightly under load, but this
    # is the finest reliable granularity for scheduled workflows.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the workflow can commit the updated state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run checker
        env:
          THEATRE_URL: ${{ vars.THEATRE_URL }}
          MOVIE_NAME: ${{ vars.MOVIE_NAME }}
          TARGET_DAY_NUM: ${{ vars.TARGET_DAY_NUM }}
          TARGET_DAY_LABEL: ${{ vars.TARGET_DAY_LABEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_shows.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_page_text.txt
            debug_screenshot.png
          retention-days: 3

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push || true
